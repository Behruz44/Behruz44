name: Market terminal

on:
  schedule:
    - cron: "23 */6 * * *"   # обновление каждые 6 часов
  workflow_dispatch:          # ручной запуск во вкладке Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests fonttools uharfbuzz

      - name: Build terminal.svg
        run: python scripts/build_terminal.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git diff --cached --quiet || git commit -m "Update market terminal"
          git push
